<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partha Chandra Sarker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#080808;--line:#1c1c1c;--text:#f2f2f2;--muted:#8d8d8d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);padding:18px}
.card+.card{margin-top:14px}
.label{font-size:12px;color:var(--muted);margin:0 0 10px}
h1{font-weight:300;font-size:clamp(34px,10vw,52px);line-height:1;letter-spacing:-.02em;margin:0 0 18px;text-transform:uppercase}
.photo{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:0;background:#000;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(10px);transform:scale(1.04);transition:opacity .8s ease,filter .8s ease,transform .8s ease}
.photo img.on{opacity:1;filter:blur(0);transform:scale(1)}
.photo:focus-visible{outline:2px solid #fff;outline-offset:3px}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:6px;justify-content:center;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .4s}
.dots i.on{background:#fff}
.bio{font-size:clamp(10.5px,3.2vw,18px);line-height:1.45;margin:18px 0 0;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.facts div{font-size:13px;color:var(--muted);line-height:1.35}
.facts strong{display:block;font-size:19px;font-weight:300;color:var(--text);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);padding:8px 12px;font-size:14px;border-radius:99px}
.contact p{font-size:16px;line-height:1.45;margin:0 0 18px;max-width:36ch}
.social{display:flex;gap:14px;flex-wrap:wrap}
.social a{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;transition:transform .2s}
.social a:hover{transform:translateY(-3px)}
.social a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.social svg{width:28px;height:28px;fill:#fff}
.fb{background:#1877f2}.wa{background:#25d366}.ig{background:linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5)}.gm{background:#fff}
.hero{transform-origin:left center;will-change:transform,filter,opacity}
.zoom{position:absolute;inset:0;transform-origin:50% 40%;will-change:transform}
.rv{opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease;transition-delay:calc(var(--i,0)*110ms)}
.rv.in{opacity:1;transform:none}
.facts strong::after{content:"";display:block;height:1px;width:0;background:#fff;margin-top:5px;transition:width .45s ease}
.facts div:hover strong::after{width:100%}
.chips li{transition:border-color .3s,transform .3s}
.chips li:hover{border-color:#555;transform:translateY(-2px)}
.track{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text)}
.sp{flex:none;width:46px;height:46px;border-radius:50%;background:#1db954;display:grid;place-items:center;transition:transform .35s}
.sp svg{width:26px;height:26px}
.track:hover .sp{transform:scale(1.08)}
.track .t{display:block;font-size:16px;line-height:1.35;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s;padding-bottom:2px;width:fit-content}
.track:hover .t{background-size:100% 1px}
.track .s{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.track:focus-visible{outline:2px solid #fff;outline-offset:4px}
.contact{text-align:center}
.contact .lc-rule{width:56px;height:1px;background:#C6A568;margin:4px auto 22px}
.contact .lc-label{font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#C6A568;margin:0 0 20px;max-width:none}
.contact .lc-title{font-family:"Playfair Display","Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(27px,7.4vw,40px);line-height:1.25;color:#F5F2EA;margin:0 auto 18px;max-width:14em}
.contact .lc-title span{color:#C6A568}
.contact .lc-desc{font-family:Inter,sans-serif;font-size:15px;font-weight:400;line-height:1.8;color:#A6A29A;max-width:520px;margin:0 auto 30px}
.contact .social{justify-content:center}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.photo img{transition-duration:.01s}.social a{transition:none}}
</style>
</head>
<body>
<main>
<section class="card">
  <div class="hero" id="hero"><p class="label">Myself</p>
  <h1>Partha Chandra Sarker</h1></div>
